<div class="add-category-card">
    <h2 class="section-title">New Category</h2>

    <form [formGroup]="categoryForm" (ngSubmit)="createCategory()" class="category-form">
        <div class="form-group">
            <label for="name">Category Name</label>
            <input id="name" type="text" formControlName="name" placeholder="e.g. Summer Collection"
                [class.invalid]="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" formControlName="description" placeholder="Briefly describe this category..."
                rows="3"
                [class.invalid]="categoryForm.get('description')?.invalid && categoryForm.get('description')?.touched"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="categoryForm.invalid">
            Save
        </button>
    </form>
</div>
