<div class="modal-backdrop" (click)="cancel()">
    <div class="edit-modal" (click)="$event.stopPropagation()">
        <header class="modal-header">
            <h2>Edit Product</h2>
            <button class="btn-close" (click)="cancel()">×</button>
        </header>

        <form [formGroup]="editForm" (ngSubmit)="save()" class="edit-form">
            <div class="form-group">
                <label for="title">Title</label>
                <input id="title" type="text" formControlName="title" placeholder="Product Title">
            </div>

            <div class="form-group">
                <label for="price">Price</label>
                <input id="price" type="number" formControlName="price" step="0.01" placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" formControlName="categoryId">
                    <option [value]="0" disabled>Select preferred category</option>
                    @for (cat of categories(); track cat.id) {
                    <option [value]="cat.id">"{{ cat.name }}"</option>
                    }
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" formControlName="description" rows="4"
                    placeholder="Full product description..."></textarea>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
                <button type="submit" class="btn btn-primary" [disabled]="editForm.invalid">Save Changes</button>
            </div>
        </form>
    </div>
</div>
